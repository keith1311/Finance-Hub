<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wallet</title>
    <link rel="stylesheet" href="wallets.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <div class="title" id="title"></div>
        <div class="total">
          <div class="label">Total Balance</div>
          <div class="value" id="total-balance">RM0.00</div>
        </div>
      </div>

      <div class="workspace">
        <div class="left">
          <div class="section-title">MONTHLY EXPENSE ANALYSIS</div>
          <div class="upper-left">
            <div class="analysis-card">
              <div class="analysis-header">
                Expense trend & category breakdown
              </div>
              <div class="analysis-chart">
                <canvas id="expense-chart"></canvas>
              </div>
            </div>
            <div class="buttons">
              <button class="btn" id="add-income">
                <i class="fa-solid fa-money-check-dollar"></i>&nbsp; Add Income
              </button>
              <button class="btn" id="create-transaction">
                <i class="fa-solid fa-cart-shopping"></i>&nbsp;Create
                Transaction
              </button>
              <button class="btn" id="open-settings">
                <i class="fa-solid fa-gear"></i>&nbsp;Settings
              </button>
              <button class="btn" id="filter-transactions">
                <i class="fa-solid fa-filter"></i>&nbsp;Filter
              </button>
              <a href="main.html" class="btn" id="close-wallet"
                ><i class="fa-solid fa-folder-closed"></i>&nbsp;Close Wallet</a
              >
            </div>
          </div>

          <div class="section-title">TRANSACTION DETAILS TABLE</div>
          <div class="table-card">
            <div class="table-headers">
              <div>Date</div>
              <div>Tags</div>
              <div>Category</div>
              <div>Amount</div>
            </div>
            <div style="height: 1px; background: #222633; margin: 6px 0"></div>
            <div class="table-scroll">
              <div class="table-details" id="table-details"></div>
            </div>
          </div>
        </div>

        <div class="right">
          <div class="card">
            <div style="font-weight: 700; margin-bottom: 8px">
              MONTHLY EXPENSES
            </div>
            <div class="chart-area" id="chart-area">
              <canvas id="expenseChart"></canvas>
            </div>
            <div class="monthly-total">
              Monthly Total: <span style="font-size: 18px">RM0.00</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="wallets.js" defer></script>
  </body>
</html>
