
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Finance Hub</title>
	<style>
		:root{--bg:#0f1317;--card:#1a1d26;--inner:#14161f;--accent:#3b6285;--muted:#8a92a6;--text:#ffffff}
		*{box-sizing:border-box}
		html,body{height:100%;margin:0;padding:0;background:var(--bg);font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
		.container{display:flex;flex-direction:column;height:100vh;padding:18px;gap:12px}
		.header{display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
		.title{font-size:22px;font-weight:700}
		.total{text-align:right}
		.total .label{color:var(--muted);font-size:13px}
		.total .value{font-size:20px;font-weight:700}

		.workspace{display:grid;grid-template-columns:3fr 1fr;gap:18px;align-items:stretch;flex:1}

		/* Left panel */
		.left{display:flex;flex-direction:column;gap:12px}
		.left .section-title{font-weight:700;margin:0}
		.wallet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;flex-shrink:0}
		.wallet{background:var(--inner);padding:14px;border-radius:12px;position:relative}
		.wallet-header{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
		.wallet-info{flex:1}
		.wallet .name{color:var(--muted);font-size:14px;margin:0}
		.wallet .balance{font-size:18px;font-weight:700;margin:8px 0 0 0}
		.menu-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 4px;color:#8a92a6;position:relative}
		.menu-btn:hover{color:var(--text)}
		.dropdown-menu{display:none;position:absolute;top:30px;right:0;background:var(--card);border:1px solid #2a2d36;border-radius:8px;min-width:140px;z-index:10;margin-top:0}
		.dropdown-menu.active{display:block}
		.dropdown-menu a{display:block;padding:10px 12px;color:var(--muted);text-decoration:none;border-bottom:1px solid #2a2d36;font-size:13px;cursor:pointer}
		.dropdown-menu a:last-child{border-bottom:none}
		.dropdown-menu a:hover{background:var(--inner);color:var(--text)}
		.manage-wrapper{position:relative;display:inline-flex}
		.manage-btn{background:var(--accent);font-size:15px;color:#fff;border-radius:6px;padding:8px 23px;border:none;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
		.manage-wrapper .dropdown-menu{min-width:100%;border-top-left-radius:0;border-top-right-radius:0;}
		.manage-btn:hover{filter:brightness(1.08)}
		.view-btn{display:inline-block;margin-top:10px;background:var(--accent);color:#fff;padding:7px 10px;border-radius:8px;text-decoration:none}

		.table-card{background:var(--inner);border-radius:12px;padding:12px;display:flex;flex-direction:column;flex:1;min-height:0}
		.table-headers{display:flex;gap:120px;color:var(--muted);font-weight:600;padding:6px 20px;flex-shrink:0}
		.table-headers div{flex:1}
		.table-scroll{flex:1;overflow-y:auto;margin-top:8px;min-height:0}
		.table-row{display:flex;gap:120px;padding:10px 4px;border-bottom:1px solid #121418;color:#cbd3da;flex-shrink:0}
		.table-row div{flex:1}
		.placeholder{color:var(--muted);font-style:italic;padding:18px;text-align:center}

		/* Right panel */
		.right{display:flex;flex-direction:column}
		.right .card{background:var(--card);border-radius:14px;padding:18px;color:var(--text);display:flex;flex-direction:column;flex:1}
		.chart-area{flex:1;min-height:220px;border-radius:8px;background:linear-gradient(180deg,#0c0f12,#0b0e11);display:flex;align-items:center;justify-content:center;color:var(--muted)}
		.monthly-total{margin-top:12px;text-align:center;font-weight:700;flex-shrink:0}

		@media (max-width:900px){.workspace{grid-template-columns:1fr}}
	</style>
</head>
<body>
	<div class="container">
		<div class="header">
			<div class="title">FINANCE HUB</div>
			<div class="total"><div class="label">Total Balance</div><div class="value">RM0.00</div></div>
		</div>

		<div class="workspace">
			<div class="left">
				<div style="display:flex;justify-content:space-between;align-items:center">
					<div class="section-title">WALLETS &amp; ACCOUNTS</div>
					<div class="manage-wrapper">
						<button class="manage-btn">Manage ▾</button>
						<div class="dropdown-menu">
							<a>Create Wallet</a>
							<a>View All Wallet</a>
						</div>
					</div>
				</div>

				<div class="wallet-grid" id="wallet-grid">
				</div>

				<div class="section-title">TRANSACTION DETAILS TABLE</div>
				<div class="table-card">
					<div class="table-headers"><div>Date</div><div>Tags</div><div>Amount</div><div>Wallet</div></div>
					<div style="height:1px;background:#222633;margin:6px 0"></div>
					<div class="table-scroll">
						<div class="placeholder">[ Your log loop data will populate new rows here dynamically ]</div>
					</div>
				</div>
			</div>

			<div class="right">
				<div class="card">
					<div style="font-weight:700;margin-bottom:8px">MONTHLY EXPENSES</div>
					<div class="chart-area">⭕<br><br>[ Donut Chart Canvas Area ]</div>
					<div class="monthly-total">Monthly Total: <span style="font-size:18px">RM0.00</span></div>
				</div>
			</div>
		</div>
	</div>
	<script>
		const walletData = [
    		{ name: "Wallet 1" }, { name: "Wallet 2" }, { name: "Wallet 3" },
    		{ name: "Wallet 4" }, { name: "Wallet 5" }, { name: "Wallet 6" }
			];

		const grid = document.getElementById('wallet-grid');

		walletData.forEach(wallet => {
			const walletDiv = document.createElement('div');
			walletDiv.className = 'wallet';
			walletDiv.innerHTML = `
				<div class="wallet-header">
							<div class="wallet-info"><div class="name">${wallet.name}</div><div class="balance">RM0.00</div></div>
							<button class="menu-btn">⋯</button>
							<div class="dropdown-menu">
								<a>Rename</a>
								<a>Delete</a>
								<a>Lock</a>
								<a>Censor</a>
								<a>Hide</a>
							</div>
						</div>
						<a class="view-btn">VIEW DETAILS</a>
			`;
			grid.appendChild(walletDiv);
		});

		document.querySelectorAll('.menu-btn, .manage-btn').forEach(btn => {
			btn.addEventListener('click', function(e) {
				e.stopPropagation();
				const menu = this.nextElementSibling;
				document.querySelectorAll('.dropdown-menu.active').forEach(m => {
					if (m !== menu) m.classList.remove('active');
				});
				if (menu) {
					menu.classList.toggle('active');
				}
			});
		});
		document.addEventListener('click', function() {
			document.querySelectorAll('.dropdown-menu.active').forEach(m => {
				m.classList.remove('active');
			});
		});
		document.querySelectorAll('.dropdown-menu a').forEach(item => {
			item.addEventListener('click', function() {
				alert('Action: ' + this.textContent);
				this.parentElement.classList.remove('active');
			});
		});
	</script>
</body>
</html>
