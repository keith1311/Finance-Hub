<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Finance Hub</title>
    <link rel="stylesheet" href="main.css" />
  </head>

  <body>
    <div class="container">
      <div class="header">
        <div class="title">FINANCE HUB</div>
        <div class="total">
          <div class="label">Total Balance</div>
          <div class="value" id="total-balance">RM0.00</div>
        </div>
      </div>

      <div class="workspace">
        <div class="left">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
            "
          >
            <div class="section-title">WALLETS &amp; ACCOUNTS</div>
            <div class="manage-wrapper">
              <button class="manage-btn">Manage ▾</button>
              <div class="dropdown-menu">
                <a>Create Wallet</a>
                <a>View All Wallet</a>
              </div>
            </div>
          </div>

          <div class="wallet-grid" id="wallet-grid"></div>

          <template id="wallet-template">
            <div class="wallet">
              <div class="wallet-header">
                <div class="wallet-info">
                  <div class="name"></div>
                  <div class="balance">RM0.00</div>
                </div>
                <button class="menu-btn">⋯</button>
                <div class="dropdown-menu">
                  <a>Rename</a>
                  <a>Delete</a>
                  <a>Lock</a>
                  <a>Censor</a>
                  <a>Hide</a>
                </div>
              </div>
              <a class="view-btn">VIEW DETAILS</a>
            </div>
          </template>

          <div class="section-title">TRANSACTION DETAILS TABLE</div>
          <div class="table-card">
            <div class="table-headers">
              <div>Date</div>
              <div>Tags</div>
              <div>Amount</div>
              <div>Wallet</div>
            </div>
            <div style="height: 1px; background: #222633; margin: 6px 0"></div>
            <div class="table-scroll">
              <div class="placeholder">
                [ Your log loop data will populate new rows here dynamically ]
              </div>
            </div>
          </div>
        </div>

        <div class="right">
          <div class="card">
            <div style="font-weight: 700; margin-bottom: 8px">
              MONTHLY EXPENSES
            </div>
            <div class="chart-area">
              ⭕<br /><br />[ Donut Chart Canvas Area ]
            </div>
            <div class="monthly-total">
              Monthly Total: <span style="font-size: 18px">RM0.00</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="main.js" defer></script>
  </body>
</html>
